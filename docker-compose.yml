# One command runs everything: `docker compose up --build`
# Works without a .env file; values below fall back to local-dev defaults.

x-health-timing: &health-timing
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 10s

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-consultant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-consultant}
      POSTGRES_DB: postgres
    ports:
      # Loopback only: the default password is weak, so never expose it to the LAN.
      # 5433 because 5432 is often taken by a local Postgres.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  task1:
    build: ./task1-knowledge-brain
    ports: ["8001:8001"]
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-consultant}:${POSTGRES_PASSWORD:-consultant}@postgres:5432/kb
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      <<: *health-timing

  task2:
    build: ./task2-inbox-agent
    ports: ["3000:3000"]
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-consultant}:${POSTGRES_PASSWORD:-consultant}@postgres:5432/inbox
      KB_URL: http://task1:8001
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      <<: *health-timing

  task3:
    build: ./task3-scope-agents
    ports: ["8003:8003"]
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-consultant}:${POSTGRES_PASSWORD:-consultant}@postgres:5432/scope
      KB_URL: http://task1:8001
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      <<: *health-timing

volumes:
  pgdata:
